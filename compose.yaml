# Local development stack: API on http://localhost:8080 (nginx -> php-fpm) + PostgreSQL.
#   docker compose up -d
#   docker compose exec app php artisan db:seed     # demo accounts, first time
# Values come from .env; DB_HOST is overridden to point at the db container.

x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-cariambulan}
  DB_USERNAME: ${DB_USERNAME:-cariambulan}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

# Call state and WebRTC signaling go out through the reverb container. Set
# here rather than in .env so every container agrees; the mobile app
# connects to port 8081 with the same key.
x-broadcast-env: &broadcast-env
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-cariambulan}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-cariambulan-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-cariambulan-secret}
  REVERB_HOST: reverb
  REVERB_PORT: 8081
  REVERB_SCHEME: http
  REVERB_SERVER_PORT: 8081

# LiveKit Cloud credentials for real-time audio communication.
# Values come from .env (https://cloud.livekit.io).
x-livekit-env: &livekit-env
  LIVEKIT_URL: ${LIVEKIT_URL:-https://your-project.livekit.cloud}
  LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-3600}
  LIVEKIT_EMPTY_TIMEOUT: ${LIVEKIT_EMPTY_TIMEOUT:-300}
  LIVEKIT_MAX_DURATION: ${LIVEKIT_MAX_DURATION:-7200}
  CALL_RINGING_TIMEOUT: ${CALL_RINGING_TIMEOUT:-30}

# Redis holds live trip-call state so polling does not hit PostgreSQL.
x-redis-env: &redis-env
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  TRIP_CALL_STORE: redis
  CACHE_STORE: redis

x-app: &app
  build: .
  image: cariambulan-server:dev
  volumes:
    - .:/var/www/html
  environment:
    <<: [*db-env, *broadcast-env, *livekit-env, *redis-env]

services:
  # php-fpm: runs the Laravel code. Not published; nginx (`web`) talks to it.
  app:
    <<: *app
    restart: unless-stopped
    environment:
      <<: [*db-env, *broadcast-env, *livekit-env, *redis-env]
      RUN_MIGRATIONS: "true"
      # This VPS is the team's test server: keep the app test accounts ready.
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # HTTP entry point for the mobile apps (port 8080).
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # HTTPS entry point: certificate from Let's Encrypt, renewed automatically.
  # Needs ports 80 (certificate challenge + redirect), 443 (site/API) and
  # 8443 (wss for Reverb) open to the internet. PUBLIC_HOST must resolve to
  # this server; the default is a sslip.io name for the VPS IP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-103-150-60-58.sslip.io}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:8443"
    depends_on:
      web:
        condition: service_healthy
      reverb:
        condition: service_started

  # Dispatches waiting emergencies every second (routes/console.php).
  scheduler:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Reverb WebSocket server for real-time WebRTC signaling and call state.
  reverb:
    <<: *app
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    ports:
      - "8081:8081"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cariambulan}
      POSTGRES_USER: ${DB_USERNAME:-cariambulan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # 5433 on the host so it doesn't clash with a local PostgreSQL.
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  caddy-data:
  caddy-config:
