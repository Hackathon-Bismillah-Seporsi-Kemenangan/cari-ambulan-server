; Pool sizing: the apps poll every second, so keep plenty of warm workers.
[www]
; Runs as root like the old `artisan serve` did, so the bind-mounted storage/
; and bootstrap/cache stay writable on the VPS (needs `php-fpm -R`).
user = root
group = root
pm = dynamic
pm.max_children = 40
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 20
pm.max_requests = 1000
clear_env = no
